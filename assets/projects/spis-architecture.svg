<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b0f"/>
      <stop offset="100%" stop-color="#0f151e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="420" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#161f2c" stroke-width="1" opacity="0.4">
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="210" x2="600" y2="210"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="180" height="24" rx="4" fill="#16202c" stroke="#253549" stroke-width="1"/>
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5eead4" font-weight="600" letter-spacing="0.08em">SPIS ARCHITECTURE</text>
  </g>

  <!-- Connection Lines with Glow -->
  <!-- Client to API -->
  <line x1="180" y1="150" x2="250" y2="150" stroke="#5eead4" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <circle cx="215" cy="150" r="4" fill="#5eead4" filter="url(#glow)"/>

  <!-- API to MySQL -->
  <line x1="420" y1="150" x2="480" y2="150" stroke="#5eead4" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <circle cx="450" cy="150" r="4" fill="#5eead4" filter="url(#glow)"/>

  <!-- API to ML Microservice (Down) -->
  <path d="M 335 195 L 335 255" stroke="#5eead4" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <circle cx="335" cy="225" r="4" fill="#5eead4" filter="url(#glow)"/>

  <!-- NODE 1: Frontend Client (Left) -->
  <g transform="translate(30, 105)">
    <rect width="150" height="90" rx="8" fill="#131a24" stroke="#253549" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="24" rx="8" fill="#192331"/>
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8ca0b3">PORT: 3000</text>
    <circle cx="134" cy="12" r="3" fill="#2dd4bf"/>
    <text x="14" y="46" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#f0f4f8" font-weight="700">React Client</text>
    <text x="14" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#8ca0b3">Vite · Material-UI</text>
    <rect x="14" y="72" width="76" height="15" rx="3" fill="#1c2b3a"/>
    <text x="19" y="83" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5eead4">JWT / RBAC</text>
  </g>

  <!-- NODE 2: Backend API (Center) -->
  <g transform="translate(250, 105)">
    <rect width="170" height="90" rx="8" fill="#131a24" stroke="#5eead4" stroke-width="1.5" filter="url(#glow)" opacity="0.3"/>
    <rect width="170" height="90" rx="8" fill="#131a24" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="24" rx="8" fill="#192331"/>
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5eead4">PORT: 5000</text>
    <circle cx="154" cy="12" r="3" fill="#5eead4"/>
    <text x="14" y="46" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#f0f4f8" font-weight="700">Node.js API</text>
    <text x="14" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#8ca0b3">Express · Inventory Engine</text>
    <rect x="14" y="72" width="86" height="15" rx="3" fill="#1c2b3a"/>
    <text x="19" y="83" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5eead4">REST Server</text>
  </g>

  <!-- NODE 3: Database (Right) -->
  <g transform="translate(480, 105)">
    <rect width="90" height="90" rx="8" fill="#131a24" stroke="#253549" stroke-width="1.5"/>
    <rect x="0" y="0" width="90" height="24" rx="8" fill="#192331"/>
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8ca0b3">SQL 8.0</text>
    <ellipse cx="45" cy="48" rx="24" ry="9" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <path d="M 21 48 L 21 72 C 21 78, 69 78, 69 72 L 69 48" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <path d="M 21 60 C 21 66, 69 66, 69 60" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <text x="45" y="86" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f0f4f8" text-anchor="middle">MySQL</text>
  </g>

  <!-- NODE 4: ML Microservice (Bottom Center) -->
  <g transform="translate(210, 255)">
    <rect width="250" height="120" rx="8" fill="#131a24" stroke="#253549" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="24" rx="8" fill="#192331"/>
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5eead4">PORT: 8001 · ML MICROSERVICE</text>
    <circle cx="234" cy="12" r="3" fill="#2dd4bf"/>
    <text x="14" y="48" font-family="'Space Grotesk', sans-serif" font-size="16" fill="#f0f4f8" font-weight="700">Python FastAPI Engine</text>
    <text x="14" y="68" font-family="'Inter', sans-serif" font-size="12" fill="#8ca0b3">Scikit-learn · Expiry Risk Analysis</text>
    <text x="14" y="86" font-family="'Inter', sans-serif" font-size="12" fill="#8ca0b3">Facebook Prophet · Demand Forecasting</text>
    
    <g transform="translate(14, 95)">
      <rect width="90" height="16" rx="3" fill="#182b26" stroke="#2dd4bf" stroke-width="0.8"/>
      <text x="6" y="12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5eead4">AUTO-REORDER</text>
      
      <rect x="96" y="0" width="105" height="16" rx="3" fill="#1c2b3a"/>
      <text x="102" y="12" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8ca0b3">PREDICTIVE ANALYTICS</text>
    </g>
  </g>
</svg>

